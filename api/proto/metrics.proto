syntax = "proto3";

package metrics;

option go_package = "github.com/magicelemental11/go-musthave-metrics-tpl/internal/proto";

message Metric {
  enum MType {
    GAUGE = 0;
    COUNTER = 1;
  }
  string id = 1;
  MType type = 2;
  int64 delta = 3;
  double value = 4;
}

message UpdateMetricsRequest {
  repeated Metric metrics = 1;
}

message UpdateMetricsResponse {}

service Metrics {
  rpc UpdateMetrics(UpdateMetricsRequest) returns (UpdateMetricsResponse);
}
